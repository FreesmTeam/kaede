name: "Build (Windows 7)"

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: "windows7-compat-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

env:
  BUN_VERSION: "1.3.14"
  RUSTUP_TOOLCHAIN: "nightly-2026-06-28"
  VITE_BUILD_TARGET: "chrome109"
  WIN7_TARGET: "x86_64-win7-windows-msvc"
  # Edge/WebView2 109.0.1518.140 (the last Windows 7-compatible version)
  WEBVIEW2_RUNTIME_URL: "https://github.com/kaede-basement/webview-109-cab/raw/refs/heads/main/microsoftedgestandaloneinstallerx64_1c890b4b8dd6b7c93da98ebdc08ecdc5e30e50cb.exe"
  WEBVIEW2_RUNTIME_SHA256: "EAC95C8095EC5F9971EADE9827D8FB67FD251F5C16E702B5312D31067E39119B"

jobs:
  compile:
    name: "Compile the launcher for Windows 7"
    runs-on: windows-2022
    timeout-minutes: 60

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install pinned Rust nightly with standard-library sources
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: ${{ env.RUSTUP_TOOLCHAIN }}
          components: rust-src

      - name: Verify the Rust build
        shell: pwsh
        run: |
          rustc --version --verbose
          cargo --version

          $targets = rustc --print target-list
          if ($targets -notcontains $env:WIN7_TARGET) {
            throw "Pinned Rust toolchain does not contain target $env:WIN7_TARGET"
          }

          $rustSrc = rustup component list --toolchain $env:RUSTUP_TOOLCHAIN |
            Select-String -Pattern '^rust-src.*\(installed\)$'
          if ($null -eq $rustSrc) {
            throw "rust-src is not installed for $env:RUSTUP_TOOLCHAIN"
          }

          $buildStd = cargo -Z help | Select-String -Pattern '^\s*-Z\s+build-std\s'
          if ($null -eq $buildStd) {
            throw "Pinned Cargo does not expose -Z build-std"
          }

      - name: Prepare the txiki sidecar
        shell: pwsh
        run: |
          $sourceSidecar = "src-tauri/binaries/txiki-server-x86_64-pc-windows-msvc.exe"
          $targetSidecar = "src-tauri/binaries/txiki-server-$env:WIN7_TARGET.exe"

          # Lenient: the upstream txiki build imports Win8+ APIs (CreateFile2,
          # GetSystemTimePreciseAsFileTime, PathCchCombine); tracked separately.
          bun ./scripts/check-windows-7-pe.ts --lenient $sourceSidecar
          Copy-Item -LiteralPath $sourceSidecar -Destination $targetSidecar

          $sourceHash = (Get-FileHash -LiteralPath $sourceSidecar -Algorithm SHA256).Hash
          $targetHash = (Get-FileHash -LiteralPath $targetSidecar -Algorithm SHA256).Hash
          if ($sourceHash -ne $targetHash) {
            throw "Win7-target sidecar alias differs from the verified source sidecar"
          }

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Build frontend
        run: bun run build:frontend

      - name: Exclude Windows 8 and newer only plugins from the build
        shell: pwsh
        run: |
          # tauri-plugin-notification uses WinRT toasts (combase.dll, Windows 8+).
          # The plugin is behind the default "notifications" cargo feature, which
          # the compile step disables; the capability file must go with it or the
          # ACL build step fails on unknown notification:* permissions.
          Remove-Item -LiteralPath "src-tauri/capabilities/plugin-notification.json"

      - name: Compile the application
        shell: pwsh
        run: |
          $env:TAURI_CONFIG = Get-Content -LiteralPath "src-tauri/tauri.conf.json" -Raw
          $cargoArgs = @(
            "build"
            "--manifest-path", "src-tauri/Cargo.toml"
            "--bins"
            "--no-default-features"
            "--features", "tauri/custom-protocol"
            "--target", $env:WIN7_TARGET
            "--release"
            "--locked"
            "-Z", "build-std"
          )

          cargo @cargoArgs

      - name: Get current build info
        id: json_properties
        uses: ActionsTools/read-json-action@9750aa7419d36b6bdc275883f2ecb4d2fdf0db2c
        with:
          file_path: "./src-tauri/tauri.conf.json"

      - name: Verify PE binaries
        shell: pwsh
        run: |
          $productName = "${{ steps.json_properties.outputs.productName }}"
          $appBinary = "src-tauri/target/$env:WIN7_TARGET/release/$productName.exe"
          $sourceSidecar = "src-tauri/binaries/txiki-server-x86_64-pc-windows-msvc.exe"
          $builtSidecar = "src-tauri/target/$env:WIN7_TARGET/release/txiki-server.exe"

          if (-not (Test-Path -LiteralPath $appBinary -PathType Leaf)) {
            throw "Tauri did not produce the expected Win7-target binary: $appBinary"
          }
          if (-not (Test-Path -LiteralPath $builtSidecar -PathType Leaf)) {
            throw "Tauri did not copy the expected Win7-target sidecar: $builtSidecar"
          }

          $sourceHash = (Get-FileHash -LiteralPath $sourceSidecar -Algorithm SHA256).Hash
          $builtHash = (Get-FileHash -LiteralPath $builtSidecar -Algorithm SHA256).Hash
          if ($sourceHash -ne $builtHash) {
            throw "Built Win7-target sidecar differs from the verified source sidecar"
          }

          # App binary must be strictly Win7-clean; sidecar is lenient for now
          # (upstream txiki build imports Win8+ APIs; tracked separately).
          bun ./scripts/check-windows-7-pe.ts $appBinary
          bun ./scripts/check-windows-7-pe.ts --lenient $builtSidecar

      - name: Bundle the portable build
        shell: pwsh
        run: |
          $productName = "${{ steps.json_properties.outputs.productName }}"
          New-Item -ItemType Directory -Force -Path portable-build
          Copy-Item "./src-tauri/target/$env:WIN7_TARGET/release/$productName.exe" -Destination "portable-build/"
          Copy-Item "./src-tauri/binaries/txiki-server-$env:WIN7_TARGET.exe" -Destination "portable-build/txiki-server.exe"
          Set-Content -Path "portable-build/portable.txt" -Value "This file is required here to enable portable mode in Kaede."

      - name: Upload the portable build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          if-no-files-found: "warn"
          name: "${{ steps.json_properties.outputs.productName }}-win7-portable-${{ steps.json_properties.outputs.version }}-${{ github.ref_name }}"
          path: "portable-build/"

      - name: Bundle the WebView2 fixed runtime
        if: env.WEBVIEW2_RUNTIME_URL != ''
        shell: pwsh
        run: |
          # Download the runtime package (Update Catalog .cab or the Edge 109
          # standalone installer .exe) and verify its integrity.
          $package = "webview2-package.bin"
          curl.exe --fail --location --output $package "$env:WEBVIEW2_RUNTIME_URL"

          $hash = (Get-FileHash -LiteralPath $package -Algorithm SHA256).Hash
          if ($hash -ne $env:WEBVIEW2_RUNTIME_SHA256) {
            throw "WebView2 runtime package hash mismatch: got $hash, expected $env:WEBVIEW2_RUNTIME_SHA256"
          }

          if ($env:WEBVIEW2_RUNTIME_URL -match '\.cab$') {
            # The cab contains the Edge Update machinery plus the real
            # installer payload named like 'MicrosoftEdge*_109....exe.{GUID}'.
            New-Item -ItemType Directory -Force -Path webview2-cab | Out-Null
            expand.exe -F:* $package webview2-cab | Out-Null

            $payload = Get-ChildItem -Path "webview2-cab" -File |
              Where-Object { $_.Name -match '109\.0\.1518\.140\.exe' } |
              Select-Object -First 1
            if ($null -eq $payload) {
              throw "Installer payload not found inside the WebView2 runtime cab"
            }

            Copy-Item -LiteralPath $payload.FullName -Destination "webview2-installer.exe"
          } else {
            # A standalone installer exe was provided directly.
            Copy-Item -LiteralPath $package -Destination "webview2-installer.exe"
          }

          # The installer is a self-extracting archive; 7-Zip unpacks it
          # without running it. Nested archives (MSEDGE.7z) hold the browser
          # files under Chrome-bin/<version>/.
          7z x webview2-installer.exe -owebview2-payload -y | Out-Null

          # Peel nested archives: the payload may contain a GUID-suffixed
          # inner installer exe, which in turn contains MSEDGE.7z.
          for ($pass = 0; $pass -lt 3; $pass += 1) {
            $nested = Get-ChildItem -Path "webview2-payload" -Recurse -File |
              Where-Object { $_.Name -match '\.7z$|\.exe\.\{[0-9A-Fa-f-]+\}$' }

            foreach ($archive in $nested) {
              $destination = "$($archive.DirectoryName)/$($archive.BaseName)-extracted"
              if (-not (Test-Path -LiteralPath $destination)) {
                7z x $archive.FullName -o"$destination" -y | Out-Null
              }
            }
          }

          $webviewExe = Get-ChildItem -Path "webview2-payload" -Recurse -Filter "msedgewebview2.exe" |
            Select-Object -First 1
          if ($null -eq $webviewExe) {
            throw "msedgewebview2.exe not found in the extracted runtime payload"
          }

          # The folder containing msedgewebview2.exe becomes 'WebView2' next to
          # the launcher; kaede auto-detects it at startup on Windows.
          Copy-Item -Path $webviewExe.DirectoryName -Destination "portable-build/WebView2" -Recurse

          bun ./scripts/check-windows-7-pe.ts --lenient "portable-build/WebView2/msedgewebview2.exe"

      - name: Upload the portable build with bundled WebView2
        if: env.WEBVIEW2_RUNTIME_URL != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          if-no-files-found: "warn"
          name: "${{ steps.json_properties.outputs.productName }}-win7-portable-full-${{ steps.json_properties.outputs.version }}-${{ github.ref_name }}"
          path: "portable-build/"

      - name: Log a message about compatibility
        shell: pwsh
        run: |
          @'
          ## Windows 7 compatibility

          See `docs/WINDOWS7-COMPATIBILITY.md` before distributing the build.
          '@ | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
