name: "Build"

on:
  push:
    paths-ignore:
      - ".gitignore"
      - "**.md"
      - flake.lock
    branches:
      - nightly
      - beta
      - rc
      - release
    tags:
      - "*"
  workflow_dispatch:

env:
  # A default value, will be overwritten later if tag exists
  APP_VERSION: "0.0.1"

jobs:
  validation:
    permissions:
      contents: read
    runs-on: ubuntu-22.04
    steps:
      - name: Check out a repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4305c38b25d97ef35a8ad1f985ccf2d2242004f2

      - name: Install RustSec audit tool
        uses: taiki-e/install-action@7572810d7dd469b651bb7793945692cf78da5dd7
        with:
          tool: cargo-audit@0.22.2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Run Rust dependency audit
        run: cargo audit --file ./src-tauri/Cargo.lock

      - name: Run dependency audit
        run: bun audit --audit-level=low

      - name: Verify patched dependency compatibility
        run: bun run check:dependency-compatibility

      - name: Run TypeScript checks
        run: bun run typecheck

      - name: Verify public declarations
        run: bun run check:types

      - name: Run ESLint
        run: bun run lint

      - name: Run Vitest
        run: bun run test

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

      - name: Run Tauri ACL smoke
        run: bun run test:tauri-acl

  tauri:
    needs: validation
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "macOS ARM"
            identifier: "macos-arm"
            platform: "macos-latest" # For Arm based macs (M1 and above).
            args: "--target aarch64-apple-darwin"
            type: "non-portable"
          - name: "macOS x86_64"
            identifier: "macos-x86"
            platform: "macos-latest" # For Intel based macs.
            args: "--target x86_64-apple-darwin"
            type: "non-portable"
          - name: "Linux"
            identifier: "linux"
            platform: "ubuntu-22.04"
            args: ""
            type: "non-portable"
          - name: "Windows"
            identifier: "windows"
            platform: "windows-latest"
            args: ""
            type: "non-portable"
          - name: "macOS ARM (Portable)"
            identifier: "macos-arm"
            platform: "macos-latest" # For Arm based macs (M1 and above).
            args: "--target aarch64-apple-darwin"
            type: "portable"
          - name: "macOS x86_64 (Portable)"
            identifier: "macos-x86"
            platform: "macos-latest" # For Intel based macs.
            args: "--target x86_64-apple-darwin"
            type: "portable"
          - name: "Linux (Portable)"
            identifier: "linux"
            platform: "ubuntu-22.04"
            args: ""
            type: "portable"
          - name: "Windows (Portable)"
            identifier: "windows"
            platform: "windows-latest"
            args: ""
            type: "portable"

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Check out a repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4305c38b25d97ef35a8ad1f985ccf2d2242004f2
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04' # This must match the platform value defined above.
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Use version from Github Tag (Non-Windows)
        if: startsWith(github.ref, 'refs/tags/') && matrix.identifier != 'windows'
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          echo "APP_VERSION=${TAG_NAME}" >> "$GITHUB_ENV"

      - name: Use version from Github Tag (Windows)
        if: startsWith(github.ref, 'refs/tags/') && matrix.identifier == 'windows'
        shell: pwsh
        run: |
          $TAG_NAME = $env:GITHUB_REF -replace 'refs/tags/', ''
          echo "APP_VERSION=$TAG_NAME" >> $env:GITHUB_ENV

      - name: Prepare build metadata
        id: json_properties
        shell: bash
        env:
          BUILD_TYPE: ${{ matrix.type }}
        run: bun ./scripts/prepare-build-metadata.ts

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Build Tauri installers (Development)
        if: (startsWith(github.ref, 'refs/tags/')) != true && matrix.type == 'non-portable'
        run: bun x tauri build ${{ matrix.args }}

      - name: Build portable macOS application bundle
        if: startsWith(matrix.identifier, 'macos-') && matrix.type == 'portable'
        run: bun x tauri build ${{ matrix.args }} --bundles app

      - name: Build portable executable without installers
        if: (matrix.identifier == 'linux' || matrix.identifier == 'windows') && matrix.type == 'portable'
        run: bun x tauri build ${{ matrix.args }} --no-bundle

      - name: Build and upload Tauri installers (Release)
        if: startsWith(github.ref, 'refs/tags/') && matrix.type == 'non-portable'
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: __VERSION__
          releaseName: "${{ steps.json_properties.outputs.productName }} v__VERSION__"
          releaseBody: "See the assets to download this version and install."
          releaseDraft: true
          prerelease: true
          args: ${{ matrix.args }}

      - name: Package macOS application tarball (Non-Release)
        if: (startsWith(github.ref, 'refs/tags/') != true) && startsWith(matrix.identifier, 'macos-') && matrix.type == 'non-portable'
        shell: bash
        env:
          MACOS_TARGET: ${{ matrix.identifier == 'macos-arm' && 'aarch64-apple-darwin' || 'x86_64-apple-darwin' }}
          PRODUCT_NAME: ${{ steps.json_properties.outputs.productName }}
        run: |
          bundle_dir="./src-tauri/target/${MACOS_TARGET}/release/bundle/macos"
          tar -czf "${bundle_dir}/${PRODUCT_NAME}.app.tar.gz" -C "${bundle_dir}" "${PRODUCT_NAME}.app"

      - name: Package portable macOS application
        if: startsWith(matrix.identifier, 'macos-') && matrix.type == 'portable'
        shell: bash
        env:
          MACOS_TARGET: ${{ matrix.identifier == 'macos-arm' && 'aarch64-apple-darwin' || 'x86_64-apple-darwin' }}
          PRODUCT_NAME: ${{ steps.json_properties.outputs.productName }}
          ARTIFACT_IDENTIFIER: ${{ matrix.identifier }}
        run: |
          bundle_dir="./src-tauri/target/${MACOS_TARGET}/release/bundle/macos"
          app_dir="${bundle_dir}/${PRODUCT_NAME}.app"
          executable_dir="${app_dir}/Contents/MacOS"
          marker_path="${executable_dir}/portable.txt"
          archive_dir="./portable-artifact"
          archive_path="${archive_dir}/${PRODUCT_NAME}-${ARTIFACT_IDENTIFIER}-portable.tar.gz"

          test -x "${executable_dir}/${PRODUCT_NAME}"
          test -x "${executable_dir}/txiki-server"
          printf '%s\n' 'This marker enables portable mode in Kaede.' > "${marker_path}"
          test -f "${marker_path}"

          mkdir -p "${archive_dir}"
          tar -czf "${archive_path}" -C "${bundle_dir}" "${PRODUCT_NAME}.app"
          tar -tzf "${archive_path}" "${PRODUCT_NAME}.app/Contents/MacOS/portable.txt" > /dev/null

      - name: Package portable Linux executable layout
        if: matrix.identifier == 'linux' && matrix.type == 'portable'
        shell: bash
        env:
          PRODUCT_NAME: ${{ steps.json_properties.outputs.productName }}
        run: |
          layout_dir="./portable-layout"
          archive_dir="./portable-artifact"
          archive_path="${archive_dir}/${PRODUCT_NAME}-linux-portable.tar.gz"

          mkdir -p "${layout_dir}" "${archive_dir}"
          install -m 755 "./src-tauri/target/release/${PRODUCT_NAME}" "${layout_dir}/${PRODUCT_NAME}"
          install -m 755 "./src-tauri/binaries/txiki-server-x86_64-unknown-linux-gnu" "${layout_dir}/txiki-server"
          printf '%s\n' 'This marker enables portable mode in Kaede.' > "${layout_dir}/portable.txt"

          test -x "${layout_dir}/${PRODUCT_NAME}"
          test -x "${layout_dir}/txiki-server"
          test -f "${layout_dir}/portable.txt"
          tar -czf "${archive_path}" -C "${layout_dir}" .
          tar -tzf "${archive_path}" './portable.txt' > /dev/null

      - name: Package portable Windows executable layout
        if: matrix.identifier == 'windows' && matrix.type == 'portable'
        shell: bash
        env:
          PRODUCT_NAME: ${{ steps.json_properties.outputs.productName }}
        run: |
          layout_dir="./portable-artifact/${PRODUCT_NAME}-windows-portable"

          mkdir -p "${layout_dir}"
          cp "./src-tauri/target/release/${PRODUCT_NAME}.exe" "${layout_dir}/${PRODUCT_NAME}.exe"
          cp "./src-tauri/binaries/txiki-server-x86_64-pc-windows-msvc.exe" "${layout_dir}/txiki-server.exe"
          printf '%s\n' 'This marker enables portable mode in Kaede.' > "${layout_dir}/portable.txt"

          test -f "${layout_dir}/${PRODUCT_NAME}.exe"
          test -f "${layout_dir}/txiki-server.exe"
          test -f "${layout_dir}/portable.txt"

      - name: Upload portable executable layout
        if: matrix.type == 'portable'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: "error"
          name: "${{ steps.json_properties.outputs.productName }}-${{ matrix.identifier }}-${{ steps.json_properties.outputs.version }}-portable-${{ steps.json_properties.outputs.artifactRef }}"
          path: "portable-artifact/"

      - name: Upload binary (Windows, NSIS)
        if: (startsWith(github.ref, 'refs/tags/') != true) && matrix.identifier == 'windows' && matrix.type == 'non-portable'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: "warn"
          name: "${{ steps.json_properties.outputs.productName }}-dev-windows-nsis-${{steps.json_properties.outputs.version}}-${{ matrix.type }}-${{ steps.json_properties.outputs.artifactRef }}"
          path: "./src-tauri/target/release/bundle/nsis/${{ steps.json_properties.outputs.productName }}_${{steps.json_properties.outputs.version}}_x64-setup.exe"

      - name: Upload binary (Windows, MSI)
        if: (startsWith(github.ref, 'refs/tags/') != true) && matrix.identifier == 'windows' && matrix.type == 'non-portable'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: "warn"
          name: "${{ steps.json_properties.outputs.productName }}-dev-windows-msi-${{steps.json_properties.outputs.version}}-${{ matrix.type }}-${{ steps.json_properties.outputs.artifactRef }}"
          path: "./src-tauri/target/release/bundle/msi/${{ steps.json_properties.outputs.productName }}_${{steps.json_properties.outputs.version}}_x64_en-US.msi"

      - name: Upload binary (Linux, DEB)
        if: (startsWith(github.ref, 'refs/tags/') != true) && matrix.identifier == 'linux' && matrix.type == 'non-portable'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: "warn"
          name: "${{ steps.json_properties.outputs.productName }}-dev-linux-deb-${{steps.json_properties.outputs.version}}-${{ matrix.type }}-${{ steps.json_properties.outputs.artifactRef }}"
          path: "./src-tauri/target/release/bundle/deb/${{ steps.json_properties.outputs.productName }}_${{steps.json_properties.outputs.version}}_amd64.deb"

      - name: Upload binary (Linux, RPM)
        if: (startsWith(github.ref, 'refs/tags/') != true) && matrix.identifier == 'linux' && matrix.type == 'non-portable'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: "warn"
          name: "${{ steps.json_properties.outputs.productName }}-dev-linux-rpm-${{steps.json_properties.outputs.version}}-${{ matrix.type }}-${{ steps.json_properties.outputs.artifactRef }}"
          path: "./src-tauri/target/release/bundle/rpm/${{ steps.json_properties.outputs.productName }}-${{steps.json_properties.outputs.version}}-1.x86_64.rpm"

      - name: Upload binary (Linux, AppImage)
        if: (startsWith(github.ref, 'refs/tags/') != true) && matrix.identifier == 'linux' && matrix.type == 'non-portable'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: "warn"
          name: "${{ steps.json_properties.outputs.productName }}-dev-linux-app-image-${{steps.json_properties.outputs.version}}-${{ matrix.type }}-${{ steps.json_properties.outputs.artifactRef }}"
          path: "./src-tauri/target/release/bundle/appimage/${{ steps.json_properties.outputs.productName }}_${{steps.json_properties.outputs.version}}_amd64.AppImage"

      - name: Upload binary (macOS, x86_64, DMG)
        if: (startsWith(github.ref, 'refs/tags/') != true) && matrix.identifier == 'macos-x86' && matrix.type == 'non-portable'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: "warn"
          name: "${{ steps.json_properties.outputs.productName }}-dev-macos-x86_64-dmg-${{steps.json_properties.outputs.version}}-${{ matrix.type }}-${{ steps.json_properties.outputs.artifactRef }}"
          path: "./src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/${{ steps.json_properties.outputs.productName }}_${{steps.json_properties.outputs.version}}_x64.dmg"

      - name: Upload binary (macOS, x86_64, tarball)
        if: (startsWith(github.ref, 'refs/tags/') != true) && matrix.identifier == 'macos-x86' && matrix.type == 'non-portable'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: "warn"
          name: "${{ steps.json_properties.outputs.productName }}-dev-macos-x86_64-tarball-${{steps.json_properties.outputs.version}}-${{ matrix.type }}-${{ steps.json_properties.outputs.artifactRef }}"
          path: "./src-tauri/target/x86_64-apple-darwin/release/bundle/macos/${{ steps.json_properties.outputs.productName }}.app.tar.gz"

      - name: Upload binary (macOS, ARM, DMG)
        if: (startsWith(github.ref, 'refs/tags/') != true) && matrix.identifier == 'macos-arm' && matrix.type == 'non-portable'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: "warn"
          name: "${{ steps.json_properties.outputs.productName }}-dev-macos-arm-dmg-${{steps.json_properties.outputs.version}}-${{ matrix.type }}-${{ steps.json_properties.outputs.artifactRef }}"
          path: "./src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/${{ steps.json_properties.outputs.productName }}_${{steps.json_properties.outputs.version}}_aarch64.dmg"

      - name: Upload binary (macOS, ARM, tarball)
        if: (startsWith(github.ref, 'refs/tags/') != true) && matrix.identifier == 'macos-arm' && matrix.type == 'non-portable'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: "warn"
          name: "${{ steps.json_properties.outputs.productName }}-dev-macos-arm-tarball-${{steps.json_properties.outputs.version}}-${{ matrix.type }}-${{ steps.json_properties.outputs.artifactRef }}"
          path: "./src-tauri/target/aarch64-apple-darwin/release/bundle/macos/${{ steps.json_properties.outputs.productName }}.app.tar.gz"
