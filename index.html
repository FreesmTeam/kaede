<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/src-tauri/icons/128x128.png" />
    <title>Kaede</title>
  </head>
  <body style="background:#111111">
    <script>
      console.log("HUH?! Who is there? You scared me!");

      // Depending on the environment, let the logger return an object
      // that logs messages into console or into both a log file and console
      function getLogger() {
        const Tauri = window.__TAURI_INTERNALS__;
        const Stringify = (error) => {
          // Some errors are string-typed instead of being objects
          if (typeof error !== "object" || error === null) {
            if (error === null || typeof error === "string") {
              return error;
            }

            let toReturn;

            try {
              toReturn = error.toString();
            } catch (error) {
              toReturn = "Unknown";
            }

            return toReturn;
          }

          const currentError = [];

          if ("name" in error && typeof error.name === "string")       { currentError.push(error.name) }
          if ("message" in error && typeof error.message === "string") { currentError.push(error.message) }
          if ("stack" in error && typeof error.stack === "string")     { currentError.push(error.stack) }

          return "\n" + currentError.join("; ");
        };
        const ConsoleLogger = {
          "stringify": (error) => Stringify(error),
          "info"     : (prefix, message) => console.log(prefix, message),
          "error"    : (prefix, message) => console.error(prefix, message),
        };

        if (
          typeof Tauri !== "object" || Tauri === null ||
          !("invoke" in Tauri) || typeof Tauri.invoke !== "function"
        ) {
          return ConsoleLogger;
        }

        const LevelEnum = { "INFO": 3, "ERROR": 5 };

        return {
          "stringify": (error) => Stringify(error),
          "info"     : (prefix, message) => {
            // It returns a promise, ~~but we do not care~~
            Tauri.invoke("plugin:log|log", {
              "level"   : LevelEnum.INFO,
              "message" : message,
              "location": prefix,
              // We actually care since rejected promises will trigger
              // the 'unhandledrejection' event, which will trigger another
              // logger call, which will probably once again reject,
              // because the logger call rejected in the first place lol
            }).catch(error => ConsoleLogger.error("index.html:70", error));
            ConsoleLogger.info(prefix, message);
          },
          "error": (prefix, message) => {
            // It returns a promise, ~~but we do not care~~
            Tauri.invoke("plugin:log|log", {
              "level"   : LevelEnum.ERROR,
              "message" : message,
              "location": prefix,
              // We actually care since rejected promises will trigger
              // the 'unhandledrejection' event, which will trigger another
              // logger call, which will probably once again reject,
              // because the logger call rejected in the first place lol
            }).catch(error => ConsoleLogger.error("index.html:83", error));
            ConsoleLogger.error(prefix, message);
          },
        };
      }
      // In case of an error, make the window visible
      function getWindowDisplay() {
        const renderError = (initialError, lineCount) => {
          const root = document.getElementById("app");

          // Skip the render if: (1) '#app' does not exist or (2) the 'childNodes' are not empty (implies the Vue mount)
          if (!root || !root.childNodes || root.childNodes.length > 0) {
            return;
          }

          const fallback = document.createElement("div");

          fallback.className =
            "h-vh w-full flex select-text items-center justify-center whitespace-pre-wrap text-center text-white";
          fallback.textContent = "A fatal error occurred that was caught at 'index.html:" +
            lineCount +
            "':" +
            log.stringify(initialError);

          root.append(fallback);
        }

        let initialized = false;

        return (initialError) => {
          if (initialized) {
            // Do not try to show the window again
            return;
          }

          try {
            initialized = true;

            // This is async
            window.__TAURI__.webviewWindow
              .getCurrentWebviewWindow()
              .show()
              .then(() => {
                log.info("index.html:126", "Successfully displayed the window on an error");
                renderError(initialError, "127");
              })
              .catch(error => {
                initialized = false;
                log.error(
                  "index.html:132",
                  "Failed to show the window: " +
                  log.stringify(error),
                );
                // Unsure in which case this text would be actually displayed,
                // but let us render 'initialError' anyway
                renderError(initialError, "138");
              });
            // Therefore, the only errors that this try-catch might catch must be related to the function accessing
          } catch (error) {
            initialized = false;
            log.error(
              "index.html:137",
              "Failed to access the 'getCurrentWebviewWindow#show' function: " +
              log.stringify(error),
            );
            // Since the caught 'error' probably means we are in a non-Tauri environment,
            // we might render 'initialError' as well
            renderError(initialError, "150");
          }
        };
      }

      const log = getLogger();
      const show = getWindowDisplay();

      log.info("index.html:158", "WebView for Kaede has loaded >.<");

      // When using macOS 10.15 in VMWare while having Safari 15.6.1,
      // accessing 'WebGL2RenderingContext' throws a module evaluation error:
      // 'ReferenceError: Can't find variable: WebGL2RenderingContext',
      // which then completely breaks Kaede and just slips past
      // error boundaries and listeners. I try to mitigate that with this measure
      // since I remember that assigning new properties at 'window' makes them
      // globally accessible. A funny thing is that this error
      // seems not to be thrown at a module evaluation step when accessing
      // the Browser live preview of Kaede even though 'WebGL2RenderingContext'
      // is still undefined, because (I think that this is the marker reason)
      // the 3D skin is not rendered in that preview.
      /*
       * if (!window.WebGL2RenderingContext) {
       *   window.WebGL2RenderingContext = undefined;
       * }
       */
      // UPD: It turns out that the WebView that is available in macOS 10.15
      // is Safari 13. And that version breaks way more things
      // than a simple 'WebGL2RenderingContext'

      // 'ErrorEvent'
      window.addEventListener("error", (event) => {
        let toPass = event.error;

        if (
          (toPass === null || toPass === undefined) &&
          ("target" in event) &&
          (typeof event.target === "object") &&
          (event.target !== null) &&
          ("src" in event.target)
        ) {
          toPass = "Most likely a fetch error to: " + event.target.src;
        }

        log.error("index.html:194", "Uncaught error: " + log.stringify(toPass));
        // Show the WebView Window if it wasn't shown before
        show(toPass);
      }, true);
      // 'PromiseRejectionEvent'
      window.addEventListener("unhandledrejection", (event) => {
        log.error("index.html:200", "Unhandled rejection: " + log.stringify(event.reason));
      }, true);

      log.info("index.html:203", "Starting 'main.ts' module evaluation");
    </script>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
