[package]
name = "kaede"
version = "0.0.0"
description = "An extensible Tauri-based Minecraft launcher written in Vue and Rust"
authors = ["windstone", "kaeeraa"]
license = "GPL-3.0"
repository = "https://github.com/kaede-basement/kaede"
edition = "2024"
rust-version = "1.97"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "=2.11.5", features = ["macos-private-api", "image-ico", "image-png", "tray-icon"] }
tauri-plugin-log = "2"

time = "0.3"
cap-std = { version = "=4.0.2", default-features = false }
cap-fs-ext = { version = "=4.0.2", default-features = false, features = ["std"] }
sha1 = "0.11.0"
md-5 = "0.11.0"
sha2 = { version = "=0.11.0", default-features = false }
sysinfo = "=0.39.6"
rayon = "1.12.0"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt", "rt-multi-thread", "sync", "time"] }
getrandom = { version = "0.4", features = ["std"] }
os_pipe = "1.2.3"
shared_child = "1.1.1"

# Non-default installed plugins
tauri-plugin-dialog = "2"
tauri-plugin-http = "2"
tauri-plugin-os = "2"
tauri-plugin-opener = "2"

# Modded shell plugin that allows any commands (...recipe for disaster?)
tauri-plugin-shellx = "2.0.16"

[dev-dependencies]
tauri = { version = "=2.11.5", features = ["test"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"

[profile.release]
# compile each crate as one unit instead of 16 parallel chunks
# slower build but more optimizations might be applied
codegen-units = 1
# link-time optimization across crates
lto = true
# remove debug symbols from the binary
strip = true

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "=1.1.4", default-features = false, features = ["fs"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem"] }

# tauri-utils 2.9.3 still selects ctor 0.8, whose Windows support is limited to
# target_vendor="pc" and rejects Rust's target_vendor="win7". This is the exact
# upstream Tauri migration to ctor 1; remove the patch after it ships on crates.io.
[patch.crates-io]
tauri-utils = { git = "https://github.com/tauri-apps/tauri", rev = "8a97d387a3a1a52f7c501762517e294d8c94e119" }
