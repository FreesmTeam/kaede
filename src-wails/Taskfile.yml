version: "3"

vars:
  APP_NAME: kaede
  FRONTEND_DIST: frontend/dist

tasks:
  default:
    desc: Build the application
    cmds:
      - task: build

  frontend:
    desc: Build the launcher frontend and stage it for embedding
    dir: ..
    cmds:
      - bun install
      - bun run build:frontend
      # Remove old dist (Unix)
      - cmd: rm -rf src-wails/{{.FRONTEND_DIST}}
        platforms: [ linux, darwin ]
      # Remove old dist (Windows) – only if exists
      - cmd: powershell -Command "if (Test-Path 'src-wails/{{.FRONTEND_DIST}}') { Remove-Item -Recurse -Force 'src-wails/{{.FRONTEND_DIST}}' }"
        platforms: [ windows ]
      # Create fresh dist directory (Unix)
      - cmd: mkdir -p src-wails/{{.FRONTEND_DIST}}
        platforms: [ linux, darwin ]
      # Create fresh dist directory (Windows)
      - cmd: powershell -Command "New-Item -ItemType Directory -Force 'src-wails/{{.FRONTEND_DIST}}' | Out-Null"
        platforms: [ windows ]
      # Copy built frontend contents (Unix)
      - cmd: cp -r dist/. src-wails/{{.FRONTEND_DIST}}/
        platforms: [ linux, darwin ]
      # Copy built frontend contents (Windows)
      - cmd: powershell -Command "Copy-Item -Recurse 'dist/*' 'src-wails/{{.FRONTEND_DIST}}/'"
        platforms: [ windows ]

  build:
    desc: Build the frontend and compile the backend around it
    deps: [frontend]
    cmds:
      - go build -o {{.APP_NAME}}{{exeExt}} .

  build:backend:
    desc: Compile the backend only, reusing whatever frontend is already staged
    cmds:
      - go build -o {{.APP_NAME}}{{exeExt}} .

  dev:
    desc: Run the backend against the Vite dev server (start `bun run dev:frontend` first)
    cmds:
      - go run .

  check:
    desc: Vet and compile-check without any system webview libraries
    env:
      GOOS: windows
      CGO_ENABLED: "0"
    cmds:
      - go build ./...
      - go vet ./...

  tidy:
    desc: Tidy the module
    cmds:
      - go mod tidy

  clean:
    desc: Remove build output
    cmds:
      - cmd: rm -rf {{.FRONTEND_DIST}} {{.APP_NAME}} {{.APP_NAME}}.exe
        platforms: [linux, darwin]
      - cmd: powershell -Command "Remove-Item -Recurse -Force {{.FRONTEND_DIST}}, {{.APP_NAME}}, {{.APP_NAME}}.exe -ErrorAction SilentlyContinue"
        platforms: [windows]
